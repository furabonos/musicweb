name: secret-scan

# 저장소 전체 git 기록에서 비밀값을 찾는다 (D-017).
# main 보호 규칙의 필수 검사 이름은 아래 job 이름 "gitleaks"다. 바꾸면 보호 규칙도 같이 바꿀 것.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1' # 매주 월요일 03:17 UTC

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  # https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks 설치 (버전·체크섬 고정)
        run: |
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$file" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${file}"
          echo "${GITLEAKS_SHA256}  ${file}" | sha256sum -c -
          tar xzf "$file" gitleaks
      - name: 전체 git 기록 검사
        run: ./gitleaks git --redact --verbose --exit-code 1 .
