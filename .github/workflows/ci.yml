name: ci

# PR과 main에서 모든 검사를 돈다 (SPEC 4.9, 6.2, T18, D-036).
# main 보호 규칙의 필수 검사 이름은 마지막 job "ci"다(모든 job이 성공해야 성공). 바꾸면 보호 규칙도 같이 바꿀 것.
# - pull_request(포크 PR에는 비밀값이 넘어가지 않음)만 쓰고 pull_request_target은 쓰지 않는다.
# - 실제 AI 시험은 같은 저장소 PR이고 ANTHROPIC_API_KEY 비밀값이 있을 때만(D-034). 지금은 키가 없어 곡 연결 시험만 비교한다.
#   구독(EVAL_LLM=cli)은 CI에 쓰지 않는다.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  static:
    name: lint·typecheck·unit·eval·bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - name: 시험 회귀 (기준보다 낮으면 실패)
        env:
          # 같은 저장소 PR·main이고 키가 있을 때만 실제 AI 시험. 아니면 빈 값 → 곡 연결 시험만
          EVAL_LLM: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.ANTHROPIC_API_KEY != '' && 'api' || '' }}
          ANTHROPIC_API_KEY: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.ANTHROPIC_API_KEY || '' }}
        run: pnpm eval
      - name: 화면 빌드에 서버 비밀값이 섞였는지
        run: pnpm scan:bundle

  emulator:
    name: rules·integration (에뮬레이터)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:rules
      - run: pnpm test:int

  e2e:
    name: e2e (에뮬레이터 + 브라우저)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: 실패하면 기록 남기기
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  ci:
    # 보호 규칙의 필수 검사. 위 job이 하나라도 성공하지 않으면 실패한다.
    name: ci
    if: always()
    needs: [static, emulator, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 모든 검사 결과 확인
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "결과: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "실패하거나 건너뛴 검사가 있습니다."
              exit 1
            fi
          done
